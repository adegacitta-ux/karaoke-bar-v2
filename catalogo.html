<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Músicas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%A4%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .bg-gradient-custom { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }

        /* Índice de letras fixo no topo da lista, tipo agenda telefônica */
        .indice-letras {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(6px);
        }

        /* Cabeçalho de cada letra também fica "grudado" enquanto rola, como nos
           contatos do celular. O "top" é calculado em JS (ver ajustarAlturaIndice)
           porque o índice A-Z quebra em mais de uma linha em telas estreitas — um
           valor fixo aqui fazia o nome da música ficar embaixo do índice quando ele
           tinha 2+ linhas. */
        .cabecalho-letra {
            position: sticky;
            top: var(--altura-indice-letras, 52px);
            z-index: 5;
        }

        /* --- MODO ESCURO (mesmo esquema do index.html/display.html) --- */
        body.modo-escuro { background-color: #0f172a; color-scheme: dark; }
        .modo-escuro .bg-gray-100 { background-color: #0f172a; }
        .modo-escuro .bg-white { background-color: #1e293b; }
        .modo-escuro .text-gray-800, .modo-escuro .text-gray-700 { color: #e5e7eb; }
        .modo-escuro .text-gray-600, .modo-escuro .text-gray-500 { color: #9ca3af; }
        .modo-escuro .text-gray-400 { color: #6b7280; }
        .modo-escuro .border-gray-100, .modo-escuro .border-gray-200,
        .modo-escuro .divide-gray-100 { border-color: #334155; }
        .modo-escuro .indice-letras { background: rgba(15, 23, 42, 0.97); }
        .modo-escuro .cabecalho-letra { background-color: #0f172a; }
        .toggle-tema-btn { background: none; border: none; cursor: pointer; font-size: 18px; color: #6b7280; padding: 6px 10px; border-radius: 8px; }
        .modo-escuro .toggle-tema-btn { color: #e5e7eb; }
        .toggle-tema-btn:hover { background-color: rgba(107, 114, 128, 0.15); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-sm mb-4">
        <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <a id="link-voltar" href="index.html" class="text-sm font-semibold text-indigo-600 hover:underline flex items-center gap-1">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar
            </a>
            <h1 class="text-lg font-bold text-gray-800">Catálogo de Músicas</h1>
            <button onclick="alternarModoEscuro()" id="btn-toggle-tema" class="toggle-tema-btn" title="Alternar modo escuro" aria-label="Alternar modo escuro" aria-pressed="false">
                <i class="fas fa-moon" id="icone-tema" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 pb-12">
        <div id="erro-sem-bar" class="hidden bg-white rounded-2xl shadow-xl p-8 text-center">
            <h2 class="text-lg font-bold text-gray-800 mb-2"><i class="fas fa-exclamation-triangle text-yellow-500 mr-2" aria-hidden="true"></i>Link incompleto</h2>
            <p class="text-gray-500 text-sm">Essa página precisa saber de qual bar é o catálogo. Volte pela tela de pedidos.</p>
        </div>

        <div id="conteudo-catalogo">
            <div class="bg-gradient-custom rounded-2xl p-6 text-white text-center mb-4 shadow-md">
                <p class="font-semibold">Sem ideia do que cantar?</p>
                <p class="opacity-90 text-sm">Escolha uma música da lista — é só tocar!</p>
            </div>

            <!-- Índice A-Z, tipo agenda telefônica do celular -->
            <div id="indice-letras" class="indice-letras flex flex-wrap gap-1 py-2 mb-2 rounded-xl">
                <!-- Inserido via JS -->
            </div>

            <div id="lista-catalogo" class="bg-white rounded-2xl shadow-md divide-y divide-gray-100 overflow-hidden">
                <!-- Inserido via JS -->
            </div>
        </div>
    </main>

    <script>
        // --- IDENTIFICAÇÃO DO BAR (mesmo esquema do index.html/display.html) ---
        function obterBarId() {
            const params = new URLSearchParams(window.location.search);
            const bar = (params.get('bar') || '').trim().toLowerCase();
            return bar.replace(/[^a-z0-9-]/g, '');
        }
        const BAR_ID = obterBarId();

        function chaveLocal(nome) {
            return `karaoke_${BAR_ID}_${nome}`;
        }

        // --- MODO ESCURO ---
        function aplicarModoEscuro(ativo) {
            document.body.classList.toggle('modo-escuro', ativo);
            const icone = document.getElementById('icone-tema');
            if (icone) icone.className = ativo ? 'fas fa-sun' : 'fas fa-moon';
            const botao = document.getElementById('btn-toggle-tema');
            if (botao) botao.setAttribute('aria-pressed', ativo ? 'true' : 'false');
        }
        function alternarModoEscuro() {
            const ativo = !document.body.classList.contains('modo-escuro');
            aplicarModoEscuro(ativo);
            localStorage.setItem(chaveLocal('modo_escuro'), ativo ? '1' : '0');
        }
        function iniciarModoEscuro() {
            const salvo = localStorage.getItem(chaveLocal('modo_escuro'));
            const ativo = salvo !== null
                ? salvo === '1'
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            aplicarModoEscuro(ativo);
        }

        // Escapa texto de usuário antes de colocar em innerHTML (mesmo cuidado do
        // index.html/display.html — aqui os dados são fixos no código, não vêm de
        // usuário, mas mantemos por consistência e segurança).
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.textContent = (texto === null || texto === undefined) ? '' : String(texto);
            return div.innerHTML;
        }

        // Remove acentos e deixa minúsculo — usado só pra AGRUPAR/ORDENAR por letra
        // (o texto exibido continua com acento normal)
        function normalizarTexto(texto) {
            return (texto || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        // --- CATÁLOGO DE MÚSICAS ---
        // Lista fixa de sugestões pra quem não sabe o que cantar. Não é uma lista de
        // links do YouTube — é só "nome da música + artista"; ao escolher, a pessoa
        // volta pra tela de pedidos com o formulário já preenchido, e ainda pode usar
        // o botão do YouTube lá pra achar um vídeo de karaokê específico se quiser.
        const CATALOGO_MUSICAS = [
            { musica: "Evidências", artista: "Chitãozinho & Xororó", genero: "Sertanejo" },
            { musica: "Ai Se Eu Te Pego", artista: "Michel Teló", genero: "Sertanejo" },
            { musica: "Modo Avião", artista: "Marília Mendonça", genero: "Sertanejo" },
            { musica: "Deixa Eu Te Amar", artista: "Henrique & Juliano", genero: "Sertanejo" },
            { musica: "Fico Assim Sem Você", artista: "Claudinho & Buchecha", genero: "Pop" },
            { musica: "Cheia de Manias", artista: "Raça Negra", genero: "Pagode" },
            { musica: "É o Amor", artista: "Zeca Pagodinho", genero: "Pagode" },
            { musica: "Deixa a Vida Me Levar", artista: "Zeca Pagodinho", genero: "Pagode" },
            { musica: "Vou Festejar", artista: "Beth Carvalho", genero: "Samba" },
            { musica: "Águas de Março", artista: "Tom Jobim", genero: "MPB" },
            { musica: "Como Nossos Pais", artista: "Elis Regina", genero: "MPB" },
            { musica: "Trem Bala", artista: "Ana Vilela", genero: "MPB" },
            { musica: "O Que Será (À Flor da Pele)", artista: "Chico Buarque", genero: "MPB" },
            { musica: "Garota de Ipanema", artista: "Tom Jobim", genero: "MPB" },
            { musica: "Tempo Perdido", artista: "Legião Urbana", genero: "Rock Nacional" },
            { musica: "Pais e Filhos", artista: "Legião Urbana", genero: "Rock Nacional" },
            { musica: "Meninos e Meninas", artista: "Skank", genero: "Rock Nacional" },
            { musica: "Metamorfose Ambulante", artista: "Raul Seixas", genero: "Rock Nacional" },
            { musica: "Ouro de Tolo", artista: "Raul Seixas", genero: "Rock Nacional" },
            { musica: "Asa Branca", artista: "Luiz Gonzaga", genero: "Forró" },
            { musica: "Numb", artista: "Linkin Park", genero: "Rock" },
            { musica: "Zombie", artista: "The Cranberries", genero: "Rock" },
            { musica: "Wonderwall", artista: "Oasis", genero: "Rock" },
            { musica: "Don't Stop Believin'", artista: "Journey", genero: "Rock" },
            { musica: "Someone Like You", artista: "Adele", genero: "Pop" },
            { musica: "My Heart Will Go On", artista: "Celine Dion", genero: "Pop" },
            { musica: "I Want It That Way", artista: "Backstreet Boys", genero: "Pop" },
            { musica: "Livin' la Vida Loca", artista: "Ricky Martin", genero: "Pop" },
            { musica: "Total Eclipse of the Heart", artista: "Bonnie Tyler", genero: "Pop" },
            { musica: "Dancing Queen", artista: "ABBA", genero: "Pop" }
        ];

        const ALFABETO = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');

        // Agrupa por primeira letra do nome da música (sem acento, maiúscula) —
        // formato "agenda telefônica": cada letra é uma seção, músicas em ordem
        // alfabética dentro dela.
        function agruparPorLetra() {
            const grupos = {};
            CATALOGO_MUSICAS.forEach(item => {
                const letra = normalizarTexto(item.musica).charAt(0).toUpperCase();
                const chave = /[A-Z]/.test(letra) ? letra : '#'; // números/símbolos caem em "#"
                if (!grupos[chave]) grupos[chave] = [];
                grupos[chave].push(item);
            });
            Object.keys(grupos).forEach(letra => {
                grupos[letra].sort((a, b) => normalizarTexto(a.musica).localeCompare(normalizarTexto(b.musica)));
            });
            return grupos;
        }

        // Mede a altura real do índice A-Z (que pode quebrar em 2+ linhas em telas
        // estreitas) e guarda numa variável CSS, usada pelo "top" do .cabecalho-letra
        // — sem isso, o cabeçalho de letra ficava sobrepondo o nome da música quando
        // o índice tinha mais de uma linha.
        function ajustarAlturaIndice() {
            const indice = document.getElementById('indice-letras');
            if (!indice) return;
            const margemInferior = parseFloat(getComputedStyle(indice).marginBottom) || 0;
            const altura = indice.offsetHeight + margemInferior;
            document.documentElement.style.setProperty('--altura-indice-letras', `${altura}px`);
        }

        function renderizarCatalogo() {
            const grupos = agruparPorLetra();
            const letrasComMusica = ALFABETO.filter(l => grupos[l]);
            if (grupos['#']) letrasComMusica.push('#');

            // Índice fixo no topo — letras com música clicáveis, sem música apagadas
            const indice = document.getElementById('indice-letras');
            indice.innerHTML = ALFABETO.concat(grupos['#'] ? ['#'] : []).map(letra => {
                const temMusica = letrasComMusica.includes(letra);
                return temMusica
                    ? `<a href="#letra-${letra}" class="w-7 h-7 flex items-center justify-center rounded-full text-xs font-bold bg-indigo-100 text-indigo-700 hover:bg-indigo-600 hover:text-white transition-colors">${letra}</a>`
                    : `<span class="w-7 h-7 flex items-center justify-center rounded-full text-xs font-bold text-gray-300">${letra}</span>`;
            }).join('');

            // Lista agrupada, com cabeçalho de letra "grudado" ao rolar
            const lista = document.getElementById('lista-catalogo');
            lista.innerHTML = letrasComMusica.map(letra => `
                <div>
                    <div id="letra-${letra}" class="cabecalho-letra bg-gray-50 px-4 py-1.5 text-xs font-bold text-gray-500 border-b border-gray-100">${letra}</div>
                    ${grupos[letra].map(item => `
                        <button type="button" onclick="escolherMusica(${CATALOGO_MUSICAS.indexOf(item)})" class="w-full flex items-center justify-between gap-3 px-4 py-3 hover:bg-indigo-50 transition-colors text-left border-b border-gray-50 last:border-0">
                            <div class="min-w-0">
                                <div class="font-semibold text-gray-800 truncate">${escaparHtml(item.musica)}</div>
                                <div class="text-xs text-gray-500 truncate">${escaparHtml(item.artista)}</div>
                            </div>
                            <i class="fas fa-chevron-right text-gray-300 flex-shrink-0" aria-hidden="true"></i>
                        </button>
                    `).join('')}
                </div>
            `).join('');
        }

        // Volta pra tela de pedidos já com a música escolhida — o index.html lê
        // "musica"/"artista" da URL e preenche o formulário sozinho.
        function escolherMusica(indice) {
            const item = CATALOGO_MUSICAS[indice];
            if (!item) return;
            const params = new URLSearchParams();
            params.set('bar', BAR_ID);
            params.set('musica', item.musica);
            params.set('artista', item.artista);
            window.location.href = 'index.html?' + params.toString();
        }

        window.addEventListener('load', () => {
            iniciarModoEscuro();
            if (!BAR_ID) {
                document.getElementById('erro-sem-bar').classList.remove('hidden');
                document.getElementById('conteudo-catalogo').classList.add('hidden');
                return;
            }
            document.getElementById('link-voltar').href = 'index.html?bar=' + encodeURIComponent(BAR_ID);
            renderizarCatalogo();
            ajustarAlturaIndice();
            window.addEventListener('resize', ajustarAlturaIndice);
        });
    </script>
</body>
</html>
