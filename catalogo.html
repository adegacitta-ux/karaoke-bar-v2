<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Músicas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8E%A4%3C%2Ftext%3E%3C%2Fsvg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Oswald:wght@300;400;500;600;700&display=swap');

        /* Mesma identidade do display.html (telão): papel de ingresso claro por
           padrão, e a marquise noturna do Città no modo escuro. Tudo abaixo lê
           essas variáveis — o modo escuro só precisa redefini-las uma vez. */
        :root {
            --cor-fundo: #f6efe1;
            --cor-painel: #fffaf0;
            --cor-texto-forte: #2b1015;
            --cor-texto-suave: #8a6f63;
            --cor-texto-fraco: #cbb9a4;
            --cor-borda: rgba(139, 94, 60, 0.18);
            --cor-realce-fraco: rgba(184, 134, 60, 0.12);
            --cor-ouro: #b8863c;
            --cor-ouro-forte: #93691f;
            --cor-neon: #c94272;
        }

        body.modo-escuro {
            --cor-fundo: #150a0f;
            --cor-painel: #241019;
            --cor-texto-forte: #f7ecd9;
            --cor-texto-suave: #c9a9a0;
            --cor-texto-fraco: #6b4a4f;
            --cor-borda: rgba(232, 176, 75, 0.22);
            --cor-realce-fraco: rgba(232, 176, 75, 0.1);
            --cor-ouro: #e8b04b;
            --cor-ouro-forte: #f5cd7e;
            --cor-neon: #ff5d8f;
        }

        body { font-family: 'Oswald', sans-serif; }

        body.bg-gray-100 { background-color: var(--cor-fundo); }

        :is(button, a, [tabindex]):focus-visible {
            outline: 2px solid var(--cor-neon);
            outline-offset: 2px;
        }

        /* --- Cabeçalho --- */
        nav.bg-white { background-color: var(--cor-painel); border-bottom: 1px solid var(--cor-borda); box-shadow: none; }
        nav .text-gray-800 {
            color: var(--cor-texto-forte);
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            letter-spacing: 0.2px;
        }
        nav .text-indigo-600 { color: var(--cor-ouro-forte); }
        nav .text-indigo-600:hover { color: var(--cor-neon); }
        .toggle-tema-btn { background: none; border: none; cursor: pointer; font-size: 17px; color: var(--cor-texto-suave); padding: 6px 10px; border-radius: 8px; transition: color .2s, background-color .2s; }
        .toggle-tema-btn:hover { background-color: var(--cor-realce-fraco); color: var(--cor-ouro-forte); }

        /* --- Banner "não sabe o que cantar" — cartaz de bilheteria, não um
           bloco de gradiente genérico: bordas tracejadas e "furos" de canhoto
           de ingresso nas laterais, como o painel do telão. --- */
        .bg-gradient-custom {
            position: relative;
            background: linear-gradient(120deg, #9a5a1f 0%, #a53564 100%);
            border: 1px dashed rgba(255, 255, 255, 0.5);
        }
        .bg-gradient-custom::before, .bg-gradient-custom::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 16px; height: 16px;
            border-radius: 50%;
            background: var(--cor-fundo);
        }
        .bg-gradient-custom::before { left: -8px; }
        .bg-gradient-custom::after { right: -8px; }
        .bg-gradient-custom p:first-child {
            font-family: 'Bodoni Moda', serif;
            font-style: italic;
            font-size: 19px;
            letter-spacing: 0.2px;
        }

        /* --- Aviso de link incompleto --- */
        #erro-sem-bar.bg-white { background-color: var(--cor-painel); border: 1px dashed var(--cor-borda); box-shadow: none; }
        #erro-sem-bar .text-gray-800 { color: var(--cor-texto-forte); }
        #erro-sem-bar .text-gray-500 { color: var(--cor-texto-suave); }
        #erro-sem-bar .text-yellow-500 { color: var(--cor-ouro); }

        /* --- Índice de letras fixo no topo da lista, tipo agenda telefônica --- */
        .indice-letras {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 250, 240, 0.94);
            backdrop-filter: blur(6px);
            border-bottom: 1px dashed var(--cor-borda);
        }
        body.modo-escuro .indice-letras { background: rgba(21, 10, 15, 0.94); }

        #indice-letras a, #indice-letras span { font-family: 'Oswald', sans-serif; }
        #indice-letras .bg-indigo-100 { background-color: var(--cor-realce-fraco); }
        #indice-letras .text-indigo-700 { color: var(--cor-ouro-forte); }
        #indice-letras .hover\:bg-indigo-600:hover { background-color: var(--cor-ouro); }
        #indice-letras .hover\:text-white:hover { color: var(--cor-painel); }
        #indice-letras .text-gray-300 { color: var(--cor-texto-fraco); }

        /* Cabeçalho de cada letra também fica "grudado" enquanto rola, como nos
           contatos do celular. O "top" é calculado em JS (ver ajustarAlturaIndice)
           porque o índice A-Z quebra em mais de uma linha em telas estreitas — um
           valor fixo aqui fazia o nome da música ficar embaixo do índice quando ele
           tinha 2+ linhas. */
        .cabecalho-letra {
            position: sticky;
            top: var(--altura-indice-letras, 52px);
            z-index: 5;
            font-family: 'Oswald', sans-serif;
        }

        /* --- Lista de músicas --- */
        /* Sem overflow-hidden aqui (era o original) — ele quebrava o
           position:sticky do .cabecalho-letra, porque um ancestral com
           overflow diferente de "visible" vira o "contêiner" da rolagem pra
           efeitos de sticky, quando deveria ser a página inteira. O primeiro
           cabeçalho de letra acabava desenhado abaixo da primeira música.
           Arredonda só os cantos das pontas pra manter o visual de cartão. */
        #lista-catalogo.bg-white { background-color: var(--cor-painel); }
        #lista-catalogo > div:first-child > .cabecalho-letra {
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }
        #lista-catalogo > div:last-child > button:last-child {
            border-bottom-left-radius: 1rem;
            border-bottom-right-radius: 1rem;
        }
        #lista-catalogo.divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: var(--cor-borda); }
        #lista-catalogo .bg-gray-50 { background-color: var(--cor-realce-fraco); }
        #lista-catalogo .border-gray-100 { border-color: var(--cor-borda); }
        #lista-catalogo .border-gray-50 { border-color: var(--cor-borda); }
        /* Sem isso os <button> pegam o cinza padrão do navegador em vez de
           deixar o fundo do painel (--cor-painel) aparecer — quase invisível
           no claro, mas bem feio no escuro. */
        #lista-catalogo button { background: transparent; }
        #lista-catalogo .hover\:bg-indigo-50:hover { background-color: var(--cor-realce-fraco); }
        #lista-catalogo .text-gray-800 { color: var(--cor-texto-forte); }
        #lista-catalogo .text-gray-500 { color: var(--cor-texto-suave); }
        #lista-catalogo .text-gray-300 { color: var(--cor-texto-fraco); }
        /* Rótulo da letra (dentro do cabecalho-letra): destacado em dourado,
           diferente da cor mais neutra usada no nome do artista abaixo dele —
           ambos compartilham a classe text-gray-500, então precisa da regra
           mais específica (id + as duas classes) pra vencer a de cima. */
        #lista-catalogo .cabecalho-letra.text-gray-500 {
            color: var(--cor-ouro-forte);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 11px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-sm mb-4">
        <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <a id="link-voltar" href="index.html" class="text-sm font-semibold text-indigo-600 hover:underline flex items-center gap-1">
                <i class="fas fa-arrow-left" aria-hidden="true"></i> Voltar
            </a>
            <h1 class="text-lg font-bold text-gray-800">Catálogo de Músicas</h1>
            <button onclick="alternarModoEscuro()" id="btn-toggle-tema" class="toggle-tema-btn" title="Alternar modo escuro" aria-label="Alternar modo escuro" aria-pressed="false">
                <i class="fas fa-moon" id="icone-tema" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 pb-12">
        <div id="erro-sem-bar" class="hidden bg-white rounded-2xl shadow-xl p-8 text-center">
            <h2 class="text-lg font-bold text-gray-800 mb-2"><i class="fas fa-exclamation-triangle text-yellow-500 mr-2" aria-hidden="true"></i>Link incompleto</h2>
            <p class="text-gray-500 text-sm">Essa página precisa saber de qual bar é o catálogo. Volte pela tela de pedidos.</p>
        </div>

        <div id="conteudo-catalogo">
            <div class="bg-gradient-custom rounded-2xl p-6 text-white text-center mb-4 shadow-md">
                <p class="font-semibold">Sem ideia do que cantar?</p>
                <p class="opacity-90 text-sm">Escolha uma música da lista — é só tocar!</p>
            </div>

            <!-- Índice A-Z, tipo agenda telefônica do celular -->
            <div id="indice-letras" class="indice-letras flex flex-wrap gap-1 py-2 mb-2 rounded-xl">
                <!-- Inserido via JS -->
            </div>

            <div id="lista-catalogo" class="bg-white rounded-2xl shadow-md divide-y divide-gray-100">
                <!-- Inserido via JS -->
            </div>
        </div>
    </main>

    <script>
        // --- IDENTIFICAÇÃO DO BAR (mesmo esquema do index.html/display.html) ---
        function obterBarId() {
            const params = new URLSearchParams(window.location.search);
            const bar = (params.get('bar') || '').trim().toLowerCase();
            return bar.replace(/[^a-z0-9-]/g, '');
        }
        const BAR_ID = obterBarId();

        function chaveLocal(nome) {
            return `karaoke_${BAR_ID}_${nome}`;
        }

        // --- MODO ESCURO ---
        function aplicarModoEscuro(ativo) {
            document.body.classList.toggle('modo-escuro', ativo);
            const icone = document.getElementById('icone-tema');
            if (icone) icone.className = ativo ? 'fas fa-sun' : 'fas fa-moon';
            const botao = document.getElementById('btn-toggle-tema');
            if (botao) botao.setAttribute('aria-pressed', ativo ? 'true' : 'false');
        }
        function alternarModoEscuro() {
            const ativo = !document.body.classList.contains('modo-escuro');
            aplicarModoEscuro(ativo);
            try {
                localStorage.setItem(chaveLocal('modo_escuro'), ativo ? '1' : '0');
            } catch (e) {
                console.warn('⚠️ Não foi possível lembrar a preferência de tema:', e);
            }
        }
        function iniciarModoEscuro() {
            let salvo = null;
            try {
                salvo = localStorage.getItem(chaveLocal('modo_escuro'));
            } catch (e) {
                console.warn('⚠️ Não foi possível ler a preferência de tema salva:', e);
            }
            const ativo = salvo !== null
                ? salvo === '1'
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            aplicarModoEscuro(ativo);
        }

        // Escapa texto de usuário antes de colocar em innerHTML (mesmo cuidado do
        // index.html/display.html — aqui os dados são fixos no código, não vêm de
        // usuário, mas mantemos por consistência e segurança).
        function escaparHtml(texto) {
            const div = document.createElement('div');
            div.textContent = (texto === null || texto === undefined) ? '' : String(texto);
            return div.innerHTML;
        }

        // Remove acentos e deixa minúsculo — usado só pra AGRUPAR/ORDENAR por letra
        // (o texto exibido continua com acento normal)
        function normalizarTexto(texto) {
            return (texto || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '');
        }

        // --- CATÁLOGO DE MÚSICAS ---
        // Lista fixa de sugestões pra quem não sabe o que cantar. Não é uma lista de
        // links do YouTube — é só "nome da música + artista"; ao escolher, a pessoa
        // volta pra tela de pedidos com o formulário já preenchido, e ainda pode usar

        const CATALOGO_MUSICAS = [

            { musica: "Como Nossos Pais", artista: "Elis Regina", genero: "MPB" },
            { musica: "Trem Bala", artista: "Ana Vilela", genero: "MPB" },
            { musica: "O Que Será (À Flor da Pele)", artista: "Chico Buarque", genero: "MPB" },
            { musica: "Garota de Ipanema", artista: "Tom Jobim", genero: "MPB" },
            { musica: "Tempo Perdido", artista: "Legião Urbana", genero: "Rock Nacional" },
            { musica: "Pais e Filhos", artista: "Legião Urbana", genero: "Rock Nacional" },
            { musica: "Meninos e Meninas", artista: "Skank", genero: "Rock Nacional" },
            { musica: "Metamorfose Ambulante", artista: "Raul Seixas", genero: "Rock Nacional" },
            { musica: "Ouro de Tolo", artista: "Raul Seixas", genero: "Rock Nacional" },
            { musica: "Asa Branca", artista: "Luiz Gonzaga", genero: "Forró" },
            { musica: "Numb", artista: "Linkin Park", genero: "Rock" },
            { musica: "Zombie", artista: "The Cranberries", genero: "Rock" },
            { musica: "Wonderwall", artista: "Oasis", genero: "Rock" },
            { musica: "Don't Stop Believin'", artista: "Journey", genero: "Rock" },
            { musica: "Someone Like You", artista: "Adele", genero: "Pop" },
            { musica: "My Heart Will Go On", artista: "Celine Dion", genero: "Pop" },
            { musica: "I Want It That Way", artista: "Backstreet Boys", genero: "Pop" },

            { musica: "Pense em Mim", artista: "Cristiano Araújo", genero: "Sertanejo" },

            { musica: "Mas Que Nada", artista: "Jorge Ben Jor", genero: "MPB" },
            { musica: "País Tropical", artista: "Jorge Ben Jor", genero: "MPB" },
            { musica: "Aquarela", artista: "Toquinho", genero: "MPB" },
            { musica: "Festa", artista: "Ivete Sangalo", genero: "Axé" },
            { musica: "Se Eu Não Te Amasse Tanto Assim", artista: "Ivete Sangalo", genero: "Axé" },
            { musica: "É o Tchan", artista: "É o Tchan", genero: "Axé" },
            { musica: "Beijinho no Ombro", artista: "Valesca Popozuda", genero: "Funk" },
            { musica: "Show das Poderosas", artista: "Anitta", genero: "Funk" },
            { musica: "Esperando na Janela", artista: "Falamansa", genero: "Forró" },
            { musica: "Xote das Meninas", artista: "Luiz Gonzaga", genero: "Forró" },
            { musica: "Codinome Beija-Flor", artista: "Cazuza", genero: "Rock Nacional" },
            { musica: "Que País É Esse", artista: "Legião Urbana", genero: "Rock Nacional" },
            { musica: "Comida", artista: "Titãs", genero: "Rock Nacional" },
            { musica: "Epitáfio", artista: "Titãs", genero: "Rock Nacional" },
            { musica: "Alagados", artista: "Os Paralamas do Sucesso", genero: "Rock Nacional" },
            { musica: "Fátima", artista: "Skank", genero: "Rock Nacional" },
            { musica: "Bohemian Rhapsody", artista: "Queen", genero: "Rock" },
            { musica: "Hotel California", artista: "Eagles", genero: "Rock" },
            { musica: "Sweet Child O' Mine", artista: "Guns N' Roses", genero: "Rock" },
            { musica: "I Will Survive", artista: "Gloria Gaynor", genero: "Pop" },
            { musica: "Billie Jean", artista: "Michael Jackson", genero: "Pop" },
            { musica: "Beat It", artista: "Michael Jackson", genero: "Pop" },
            { musica: "Y.M.C.A.", artista: "Village People", genero: "Pop" },
            { musica: "Perfect", artista: "Ed Sheeran", genero: "Pop" },
            { musica: "Shape of You", artista: "Ed Sheeran", genero: "Pop" },
            { musica: "Rolling in the Deep", artista: "Adele", genero: "Pop" },
            { musica: "Africa", artista: "Toto", genero: "Pop" },
            { musica: "Take On Me", artista: "a-ha", genero: "Pop" }
        ];

        const ALFABETO = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');

        // Agrupa por primeira letra do nome da música (sem acento, maiúscula) —
        // formato "agenda telefônica": cada letra é uma seção, músicas em ordem
        // alfabética dentro dela.
        function agruparPorLetra() {
            const grupos = {};
            CATALOGO_MUSICAS.forEach(item => {
                const letra = normalizarTexto(item.musica).charAt(0).toUpperCase();
                const chave = /[A-Z]/.test(letra) ? letra : '#'; // números/símbolos caem em "#"
                if (!grupos[chave]) grupos[chave] = [];
                grupos[chave].push(item);
            });
            Object.keys(grupos).forEach(letra => {
                grupos[letra].sort((a, b) => normalizarTexto(a.musica).localeCompare(normalizarTexto(b.musica)));
            });
            return grupos;
        }

        // Mede a altura real do índice A-Z (que pode quebrar em 2+ linhas em telas
        // estreitas) e guarda numa variável CSS, usada pelo "top" do .cabecalho-letra
        // — sem isso, o cabeçalho de letra ficava sobrepondo o nome da música quando
        // o índice tinha mais de uma linha.
        function ajustarAlturaIndice() {
            const indice = document.getElementById('indice-letras');
            if (!indice) return;
            const margemInferior = parseFloat(getComputedStyle(indice).marginBottom) || 0;
            const altura = indice.offsetHeight + margemInferior;
            document.documentElement.style.setProperty('--altura-indice-letras', `${altura}px`);
        }

        function renderizarCatalogo() {
            const grupos = agruparPorLetra();
            const letrasComMusica = ALFABETO.filter(l => grupos[l]);
            if (grupos['#']) letrasComMusica.push('#');

            // Índice fixo no topo — letras com música clicáveis, sem música apagadas
            const indice = document.getElementById('indice-letras');
            indice.innerHTML = ALFABETO.concat(grupos['#'] ? ['#'] : []).map(letra => {
                const temMusica = letrasComMusica.includes(letra);
                return temMusica
                    ? `<a href="#letra-${letra}" class="w-7 h-7 flex items-center justify-center rounded-full text-xs font-bold bg-indigo-100 text-indigo-700 hover:bg-indigo-600 hover:text-white transition-colors">${letra}</a>`
                    : `<span class="w-7 h-7 flex items-center justify-center rounded-full text-xs font-bold text-gray-300">${letra}</span>`;
            }).join('');

            // Lista agrupada, com cabeçalho de letra "grudado" ao rolar
            const lista = document.getElementById('lista-catalogo');
            lista.innerHTML = letrasComMusica.map(letra => `
                <div>
                    <div id="letra-${letra}" class="cabecalho-letra bg-gray-50 px-4 py-1.5 text-xs font-bold text-gray-500 border-b border-gray-100">${letra}</div>
                    ${grupos[letra].map(item => `
                        <button type="button" onclick="escolherMusica(${CATALOGO_MUSICAS.indexOf(item)})" class="w-full flex items-center justify-between gap-3 px-4 py-3 hover:bg-indigo-50 transition-colors text-left border-b border-gray-50 last:border-0">
                            <div class="min-w-0">
                                <div class="font-semibold text-gray-800 truncate">${escaparHtml(item.musica)}</div>
                                <div class="text-xs text-gray-500 truncate">${escaparHtml(item.artista)}</div>
                            </div>
                            <i class="fas fa-chevron-right text-gray-300 flex-shrink-0" aria-hidden="true"></i>
                        </button>
                    `).join('')}
                </div>
            `).join('');
        }

        // Volta pra tela de pedidos já com a música escolhida — o index.html lê
        // "musica"/"artista" da URL e preenche o formulário sozinho.
        function escolherMusica(indice) {
            const item = CATALOGO_MUSICAS[indice];
            if (!item) return;
            const params = new URLSearchParams();
            params.set('bar', BAR_ID);
            params.set('musica', item.musica);
            params.set('artista', item.artista);
            window.location.href = 'index.html?' + params.toString();
        }

        window.addEventListener('load', () => {
            iniciarModoEscuro();
            if (!BAR_ID) {
                document.getElementById('erro-sem-bar').classList.remove('hidden');
                document.getElementById('conteudo-catalogo').classList.add('hidden');
                return;
            }
            document.getElementById('link-voltar').href = 'index.html?bar=' + encodeURIComponent(BAR_ID);
            renderizarCatalogo();

            // ResizeObserver em vez de só medir uma vez + ouvir "resize": o Tailwind
            // (carregado via CDN) aplica as classes de forma ASSÍNCRONA — se a rede
            // estiver mais lenta, dava pra medir a altura do índice ANTES dele ficar
            // com o tamanho final (pílulas com padding), gravando uma altura pequena
            // demais na variável CSS. O resultado: o cabeçalho da letra ficava
            // sobreposto/ilegível atrás do nome da primeira música. ResizeObserver
            // dispara de novo sozinho toda vez que o tamanho real do índice muda —
            // por causa do Tailwind terminar de aplicar o estilo, troca de fonte,
            // redimensionar a janela, ou virar o celular — sem depender de acertar
            // o timing manualmente.
            const indice = document.getElementById('indice-letras');
            if (indice && window.ResizeObserver) {
                new ResizeObserver(ajustarAlturaIndice).observe(indice);
            } else {
                // Navegador sem ResizeObserver (raríssimo hoje em dia): volta pro
                // comportamento antigo, imperfeito mas melhor que nada.
                ajustarAlturaIndice();
                window.addEventListener('resize', ajustarAlturaIndice);
            }
        });
    </script>
</body>
</html>
