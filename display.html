<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Exibição - Karaokê Do Città</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8E%A4%3C%2Ftext%3E%3C%2Fsvg%3E">
    <!-- PWA: manifest, cores de instalação e tags específicas de iOS (iOS não lê manifest.json integralmente) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#08090D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cantokê">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Oswald:wght@300;400;500;600;700&display=swap');

        /* Paleta de alto contraste pra leitura de longe num telão de bar —
           fundo quase preto puro, texto branco, amarelo pros destaques
           (títulos e nome da música), magenta pra identidade/decoração e
           verde-turquesa pro status "conectado". Nada de dourado escuro
           sobre vinho nem cinza em informação importante. */
        :root {
            --cor-fundo-1: #08090D;
            --cor-fundo-2: #111217;
            --cor-painel: #101218;
            --cor-painel-clara: #171a22;
            --cor-ouro: #FFD43B;
            --cor-ouro-claro: #FFE180;
            --cor-neon: #FF4F81;
            --cor-marfim: #FFFFFF;
            --cor-suave: #A9AFC0;
            --cor-status-ok: #22D3A6;
            --cor-texto-sobre-destaque: #0B0C10;
        }

        /* box-sizing explícito: o layout novo depende de padding grande +
           height:100vh batendo certinho, e não dá pra confiar só no preflight
           do Tailwind CDN pra isso — essa página já assume que o CDN pode
           falhar no wifi do bar (ver comentário logo abaixo). */
        *, *::before, *::after { box-sizing: border-box; }
        * { font-family: 'Oswald', sans-serif; }

        /* Rede de segurança: se o CDN do Tailwind demorar/falhar num wifi
           ruim do bar, os estados (aguardando / próximo / fila encerrada)
           não podem aparecer todos sobrepostos na tela. */
        .hidden { display: none !important; }

        body {
            background:
                radial-gradient(ellipse 900px 620px at 50% -8%, rgba(255, 212, 59, 0.18), transparent 60%),
                radial-gradient(ellipse 800px 560px at 92% 105%, rgba(255, 79, 129, 0.16), transparent 60%),
                linear-gradient(180deg, var(--cor-fundo-1) 0%, var(--cor-fundo-2) 100%);
            color: var(--cor-marfim);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Moldura de lâmpadas correndo, como a marquise de um teatro/clube antigo */
        .marquise {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 12px;
            z-index: 5;
            pointer-events: none;
        }
        .marquise::before, .marquise::after {
            content: '';
            position: absolute;
            left: -28px; right: -28px;
            height: 6px;
        }
        .marquise::before {
            top: 0;
            background: radial-gradient(circle, var(--cor-ouro) 0 3px, transparent 4px) 0 0 / 28px 6px repeat-x;
            filter: drop-shadow(0 0 4px rgba(255, 212, 59, 0.8));
            animation: correrLampadas 1.6s linear infinite;
        }
        .marquise::after {
            top: 6px;
            background: radial-gradient(circle, var(--cor-neon) 0 2.5px, transparent 3.5px) 14px 0 / 28px 6px repeat-x;
            filter: drop-shadow(0 0 4px rgba(255, 79, 129, 0.7));
            opacity: 0.85;
            animation: correrLampadas 1.6s linear infinite reverse;
        }
        @keyframes correrLampadas {
            from { background-position-x: 0; }
            to { background-position-x: 28px; }
        }

        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            height: 100vh;
            justify-content: center;
            align-items: center;
            gap: clamp(16px, 2.2vw, 40px);
            padding: 16px;
            overflow-y: auto;
        }

        /* Cartaz principal: cara de "passe de bastidor", não de card de app */
        .display-card {
            background: var(--cor-painel);
            border-radius: clamp(18px, 1.4vw, 32px);
            padding: clamp(20px, 2.2vw, 44px) clamp(28px, 4.4vw, 84px);
            box-shadow: 0 0 0 1px rgba(255, 212, 59, 0.35), 0 0 0 7px rgba(255, 212, 59, 0.08), 0 30px 70px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: min(60vw, 1180px);
            width: 100%;
            /* Reserva fixa de espaço pro status pill (topo) e pra barra de
               controles (rodapé), que são position:fixed e não empurram
               este container — por isso a reserva é feita aqui, não no
               padding do .main-container (evita ter duas contas pra
               manter sincronizadas em cada resolução). */
            max-height: calc(100vh - 196px);
            flex: 1 1 480px;
            overflow-y: auto;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .display-logo {
            width: clamp(90px, 8vw, 170px);
            height: auto;
            margin-bottom: clamp(12px, 1.2vw, 24px);
        }

        /* "Título principal": o estado da tela (Aguardando / Próximo a Cantar /
           Fila Encerrada) — precisa ser lido em 1 segundo a 5+ metros de distância. */
        .titulo-proximo {
            font-size: clamp(30px, 3vw, 60px);
            color: var(--cor-ouro);
            margin-bottom: clamp(10px, 1.4vw, 26px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: clamp(2px, 0.35vw, 6px);
        }

        .mensagem-secundaria {
            font-size: clamp(26px, 2.2vw, 44px);
            color: var(--cor-marfim);
            font-style: italic;
            font-weight: 300;
            margin-top: clamp(4px, 0.6vw, 12px);
        }

        /* Nome de quem vai cantar: o elemento-herói da tela, o maior de todos —
           responde "quem está cantando?" de longe, sem precisar chegar perto. */
        .cantor-nombre {
            font-family: 'Bodoni Moda', serif;
            font-size: clamp(56px, 5.6vw, 150px);
            font-weight: 800;
            font-style: italic;
            line-height: 1.05;
            background: linear-gradient(100deg, var(--cor-ouro-claro) 0%, var(--cor-neon) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 212, 59, 0.35);
            margin-bottom: clamp(4px, 0.8vw, 14px);
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        /* "Canhoto de ingresso": painel de dados com friso pontilhado (perfuração) */
        .musica-info {
            position: relative;
            background: var(--cor-painel-clara);
            border: 1px dashed rgba(255, 212, 59, 0.4);
            padding: clamp(10px, 1.4vw, 20px) 18px clamp(8px, 1.1vw, 16px);
            border-radius: 14px;
            margin: clamp(10px, 1.4vw, 18px) 0 0;
        }
        .musica-info::before, .musica-info::after {
            content: '';
            position: absolute;
            top: -9px;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--cor-painel);
            box-shadow: 0 0 0 1px rgba(255, 212, 59, 0.35) inset;
        }
        .musica-info::before { left: -9px; }
        .musica-info::after { right: -9px; }

        /* Nome da música: o segundo elemento mais importante — precisa
           "dominar a tela" junto com o nome de quem canta. Amarelo, não
           branco, porque é informação de destaque, não texto corrido. */
        .musica-titulo {
            font-size: clamp(46px, 4.6vw, 116px);
            line-height: 1.05;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--cor-ouro);
            margin-bottom: clamp(2px, 0.5vw, 8px);
        }

        .musica-artista {
            font-size: clamp(30px, 2.6vw, 54px);
            color: var(--cor-marfim);
            opacity: 0.85;
            font-weight: 300;
            font-style: italic;
            margin-bottom: clamp(8px, 1vw, 20px);
        }

        .veces-cantadas {
            display: inline-block;
            background: transparent;
            border: 2px solid var(--cor-ouro);
            color: var(--cor-ouro-claro);
            padding: clamp(6px, 0.6vw, 12px) clamp(16px, 1.6vw, 30px);
            border-radius: 50px;
            font-size: clamp(18px, 1.4vw, 30px);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fila-info {
            margin-top: clamp(16px, 1.6vw, 32px);
            display: flex;
            justify-content: space-around;
            gap: clamp(10px, 1.2vw, 22px);
        }

        /* Status da fila (2ª prioridade da hierarquia) e "A seguir" (secundário):
           bem maiores que a versão original, mas conscientemente menores que o
           nome de quem canta/música — senão competem pela atenção. */
        .fila-stat {
            background: var(--cor-painel-clara);
            border: 1px dashed rgba(255, 212, 59, 0.28);
            padding: clamp(8px, 0.8vw, 16px) clamp(6px, 0.7vw, 12px);
            border-radius: clamp(8px, 0.8vw, 14px);
            flex: 1;
        }

        .stat-numero {
            font-family: 'Bodoni Moda', serif;
            font-size: clamp(24px, 2.1vw, 44px);
            font-weight: 700;
            color: var(--cor-ouro-claro);
            line-height: 1;
        }

        .stat-label {
            font-size: clamp(11px, 0.85vw, 15px);
            color: var(--cor-marfim);
            opacity: 0.75;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: clamp(3px, 0.5vw, 8px);
        }

        /* Controles secundários: grandes o bastante pra apontar/tocar com
           facilidade, mas visualmente mais discretos que a música em cartaz —
           ficam apagados (transparentes) até o hover/foco. */
        .control-bar {
            position: fixed;
            bottom: clamp(14px, 1.6vw, 30px);
            left: 50%;
            transform: translateX(-50%);
            background: rgba(8, 9, 13, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 212, 59, 0.3);
            padding: clamp(10px, 0.9vw, 18px) clamp(16px, 1.6vw, 30px);
            border-radius: 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            display: flex;
            gap: clamp(10px, 1.2vw, 22px);
            z-index: 50;
        }

        .control-btn {
            background: transparent;
            border: 2px solid rgba(255, 212, 59, 0.5);
            color: var(--cor-ouro-claro);
            min-height: clamp(52px, 4vw, 68px);
            padding: 0 clamp(20px, 1.8vw, 34px);
            border-radius: 50px;
            font-size: clamp(18px, 1.4vw, 26px);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: background 0.25s, color 0.25s, transform 0.15s;
        }

        .control-btn:active { transform: scale(0.97); }

        .control-btn:hover {
            background: var(--cor-ouro);
            color: var(--cor-texto-sobre-destaque);
        }

        .control-btn:focus-visible,
        .fullscreen-btn:focus-visible {
            outline: 2px solid var(--cor-neon);
            outline-offset: 2px;
        }

        .pulse {
            animation: pulse 2.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 212, 59, 0.45), 0 0 0 1px rgba(255, 212, 59, 0.35); }
            50% { box-shadow: 0 0 0 16px rgba(255, 212, 59, 0), 0 0 0 1px rgba(255, 212, 59, 0.35); }
        }

        @media (max-width: 1024px) {
            /* Abaixo de 1024px não sobra largura pra card + QR lado a lado
               (isso é celular/tablet, não TV) — volta a empilhar. */
            .main-container { flex-direction: column; padding-top: 90px; }
            .display-card { padding: 26px 30px; max-width: 100%; flex: none; }
            .qr-card { max-width: 100%; flex: none; }
            .cantor-nombre { font-size: 54px; }
            .titulo-proximo { font-size: 17px; }
            .musica-titulo { font-size: 28px; }
            .musica-artista { font-size: 20px; }
        }

        @media (max-width: 768px) {
            .display-card { padding: 20px 20px; }
            .display-logo { width: 90px; }
            .cantor-nombre { font-size: 42px; }
            .titulo-proximo { font-size: 16px; letter-spacing: 3px; }
            .musica-titulo { font-size: 26px; }
            .musica-artista { font-size: 19px; }
            .fila-info { flex-direction: column; gap: 8px; }
            .veces-cantadas { font-size: 14px; }
            .mensagem-secundaria { font-size: 20px; }
        }

        /* 1280x720 e 1366x768 (TVs reais, resoluções-alvo) já caem aqui por
           altura — não é "janela pequena", é uma TV de verdade. Por isso este
           bloco só entra numa altura bem menor (janela de preview não-maximizada,
           não uma TV em tela cheia) e só ajusta espaçamento, nunca reduz a
           tipografia principal a ponto de ficar ilegível de longe. */
        @media (max-height: 560px) {
            .display-card { padding: 16px 24px; }
            .musica-info { padding: 10px 14px 8px; margin: 10px 0 0; }
            .fila-info { margin-top: 8px; }
            .fila-stat { padding: 6px 8px; }
            .mini-fila-lista { margin-top: 8px; }
            .mini-fila-item { padding: 5px 12px; margin-bottom: 3px; }
            .display-logo { width: 60px; margin-bottom: 6px; }
        }

        .fullscreen-btn {
            position: fixed;
            top: clamp(16px, 1.6vw, 30px);
            right: clamp(16px, 1.6vw, 30px);
            background: rgba(8, 9, 13, 0.75);
            border: 1px solid rgba(255, 212, 59, 0.45);
            color: var(--cor-ouro-claro);
            width: clamp(44px, 3vw, 60px);
            height: clamp(44px, 3vw, 60px);
            border-radius: 50%;
            cursor: pointer;
            font-size: clamp(17px, 1.3vw, 24px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
            z-index: 110;
            transition: transform 0.3s, background 0.3s;
        }

        .fullscreen-btn:hover {
            transform: scale(1.08);
            background: rgba(255, 212, 59, 0.2);
        }

        /* Timer e status do Firebase: informação de apoio, não de destaque —
           ficam no topo, pequenos, sem competir com música/QR Code. */
        .timer {
            position: fixed;
            top: clamp(16px, 1.6vw, 30px);
            left: clamp(16px, 1.6vw, 30px);
            background: rgba(8, 9, 13, 0.75);
            border: 1px solid rgba(255, 212, 59, 0.45);
            padding: clamp(8px, 0.7vw, 14px) clamp(14px, 1.3vw, 24px);
            border-radius: 50px;
            font-size: clamp(15px, 1.1vw, 22px);
            font-weight: 600;
            color: var(--cor-ouro-claro);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
        }

        .firebase-status {
            position: fixed;
            top: clamp(16px, 1.6vw, 30px);
            left: 50%;
            transform: translateX(-50%);
            padding: clamp(8px, 0.7vw, 14px) clamp(14px, 1.3vw, 24px);
            border-radius: 50px;
            font-size: clamp(13px, 0.95vw, 18px);
            font-weight: 600;
            letter-spacing: 0.3px;
            z-index: 100;
            color: var(--cor-marfim);
            background: rgb(34, 211, 166);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
        }

        /* Fagulhas/notas subindo do palco no fundo */
        .notas-flutuantes {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .nota-flutuante {
            position: absolute;
            bottom: -60px;
            color: var(--cor-ouro);
            opacity: 0.16;
            animation: subirNota linear infinite;
        }
        .nota-flutuante:nth-child(3n) { color: var(--cor-neon); }

        @keyframes subirNota {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.16; }
            90% { opacity: 0.16; }
            100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
        }

        .qr-card, .control-bar, .timer, .firebase-status {
            /* Importante: NÃO definir "position" aqui — cada um já tem seu próprio
               position: fixed declarado antes. Sobrescrever pra "relative" aqui foi
               o bug que tirava tudo do lugar (timer, QR e botão de tela cheia).
               O .fullscreen-btn foi removido dessa lista porque precisa de um
               z-index mais alto (110) pra nunca ficar escondido atrás de nada. */
            z-index: 10;
        }

        /* Card do QR Code para pedidos — segue o mesmo idioma visual de "passe" —
           fica abaixo do card principal, no fluxo normal da página */
        /* Bloco "Quer Cantar?": precisa ser grande e óbvio — é o único jeito
           de alguém sentado longe da tela entrar na fila. QR Code grande
           o bastante pra escanear sem precisar chegar perto da TV. */
        .qr-card {
            background: rgba(16, 18, 24, 0.92);
            border: 2px dashed rgba(255, 212, 59, 0.5);
            border-radius: clamp(14px, 1.2vw, 24px);
            padding: clamp(18px, 1.8vw, 34px) clamp(16px, 1.8vw, 32px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: clamp(10px, 1.2vw, 20px);
            max-width: min(26vw, 340px);
            width: 100%;
            max-height: calc(100vh - 196px);
            overflow-y: auto;
            flex: 0 1 280px;
            margin: 0;
        }

        .qr-card img {
            width: clamp(110px, 11vw, 200px);
            height: clamp(110px, 11vw, 200px);
            border-radius: 12px;
            flex-shrink: 0;
            background: #fff;
            padding: 6px;
        }

        .qr-card .qr-texto { text-align: center; }
        .qr-card .qr-titulo {
            font-size: clamp(24px, 2.1vw, 42px);
            font-weight: 800;
            color: var(--cor-ouro);
            line-height: 1.15;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .qr-card .qr-sub {
            font-size: clamp(16px, 1.3vw, 24px);
            color: var(--cor-marfim);
            opacity: 0.85;
            font-weight: 500;
            line-height: 1.3;
            margin-top: clamp(4px, 0.5vw, 10px);
        }

        /* Lista de próximos na fila, dentro do card principal */
        .mini-fila-lista { margin-top: clamp(10px, 1vw, 20px); text-align: left; }
        .mini-fila-titulo {
            font-size: clamp(13px, 1vw, 18px);
            font-weight: 700;
            color: var(--cor-marfim);
            opacity: 0.75;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: clamp(6px, 0.6vw, 12px);
            text-align: center;
        }
        .mini-fila-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--cor-painel-clara); border-radius: 10px;
            padding: clamp(6px, 0.6vw, 12px) clamp(10px, 1vw, 18px);
            margin-bottom: clamp(4px, 0.5vw, 8px);
            border-left: 3px solid var(--cor-ouro);
        }
        .mini-fila-item .mini-fila-nome { font-weight: 600; color: var(--cor-marfim); font-size: clamp(15px, 1.2vw, 22px); }
        .mini-fila-item .mini-fila-musica { color: var(--cor-marfim); opacity: 0.7; font-size: clamp(13px, 1vw, 18px); }
        .mini-fila-posicao {
            background: var(--cor-ouro); color: var(--cor-texto-sobre-destaque);
            width: clamp(20px, 1.6vw, 28px); height: clamp(20px, 1.6vw, 28px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: clamp(14px, 1.1vw, 20px); font-weight: 700; margin-right: clamp(8px, 0.9vw, 16px);
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            /* Celular/tablet estreito: card e QR não cabem lado a lado —
               volta a empilhar, QR embaixo do card principal. */
            .main-container { flex-direction: column; padding-top: 90px; }
            .display-card { max-width: 100%; flex: none; }
            .qr-card { max-width: 100%; flex: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .marquise::before, .marquise::after,
            .nota-flutuante,
            .pulse,
            .display-card,
            .cantor-nombre {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Moldura de lâmpadas correndo -->
    <div class="marquise"></div>

    <!-- Fagulhas/notas musicais decorativas -->
    <div class="notas-flutuantes" id="notas-flutuantes"></div>

    <!-- Status Firebase -->
    <div class="firebase-status" id="firebase-status">
        <i class="fas fa-circle mr-2" style="animation: pulse 1s infinite;"></i>
        <span id="status-text">🔥 Conectado ao Firebase</span>
    </div>

    <!-- Timer -->
    <div class="timer">
        <i class="fas fa-hourglass-half mr-2"></i><span id="tempo-display">0 min</span>
    </div>

    <!-- Botão Tela Cheia -->
    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Tela cheia">
        <i class="fas fa-expand"></i>
    </button>

    <!-- Contenedor Principal -->
    <div class="main-container">
        <div class="display-card pulse" id="display-card">

            <!-- Estado Inicial -->
            <div id="estado-inicial" class="hidden">
                <h1 class="titulo-proximo">Karaokê Do Città</h1>
                <p class="mensagem-secundaria">Aguardando próxima música...</p>
            </div>

            <!-- Fila Vazia -->
            <div id="fila-vazia" class="hidden">
                <h1 class="titulo-proximo">Fila Encerrada</h1>
                <p class="mensagem-secundaria">Obrigado por participar!</p>
            </div>

            <!-- Apresentação em Andamento ou Próximo Cantor -->
            <div id="proximo-cantor" class="hidden">

                <h1 class="titulo-proximo" id="titulo-apresentacao">Próximo a Cantar</h1>

                <div class="cantor-nombre" id="cantor-nombre">-</div>

                <div class="musica-info">
                    <div class="musica-titulo" id="musica-titulo">-</div>
                    <div class="musica-artista" id="musica-artista">-</div>
                    <div style="margin-top:12px;" id="avaliacao-info"></div>
                    <div class="veces-cantadas" id="veces-cantadas">0x</div>
                </div>

                <div class="fila-info">
                    <div class="fila-stat">
                        <div class="stat-numero" id="proximos-na-fila">0</div>
                        <div class="stat-label">Próximos na Fila</div>
                    </div>
                    <div class="fila-stat">
                        <div class="stat-numero" id="tempo-espera-display">0</div>
                        <div class="stat-label">min de Espera</div>
                    </div>
                    <div class="fila-stat">
                        <div class="stat-numero" id="ja-cantadas-hoje">0</div>
                        <div class="stat-label">Já Cantaram Hoje</div>
                    </div>
                </div>

                <div class="mini-fila-lista" id="mini-fila-lista">
                    <div class="mini-fila-titulo">A Seguir</div>
                    <div id="mini-fila-itens"></div>
                </div>
            </div>

        </div>

        <!-- Card com QR Code para pedir música — abaixo do card principal,
             nunca sobrepondo o conteúdo -->
        <div class="qr-card">
            <img id="qr-code-img" src="" alt="QR Code para pedir música" />
            <div class="qr-texto">
                <div class="qr-titulo">Quer Cantar?</div>
                <div class="qr-sub"><i class="fas fa-mobile-alt mr-1"></i>Aponte a câmera do celular</div>
                <div class="qr-sub"><i class="fas fa-qrcode mr-1"></i>Escaneie e escolha sua música</div>
            </div>
        </div>
    </div>

    <!-- Barra de Control -->
    <div class="control-bar">
        <button class="control-btn" onclick="atualizarDisplay()">
            <i class="fas fa-sync mr-2"></i>Atualizar
        </button>
        <button class="control-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left mr-2"></i>Voltar
        </button>
        <button class="control-btn" onclick="resetarDisplay()">
            <i class="fas fa-redo mr-2"></i>Resetar
        </button>
    </div>

    <script>
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyB-jzmAdf2eFqpEQVKkFdf7wkURvbzTZBY",
            authDomain: "karaoke-bar-v2.firebaseapp.com",
            databaseURL: "https://karaoke-bar-v2-default-rtdb.firebaseio.com",
            projectId: "karaoke-bar-v2",
            storageBucket: "karaoke-bar-v2.firebasestorage.app",
            messagingSenderId: "851258881456",
            appId: "1:851258881456:web:fb899c2fad3e142b755275",
            measurementId: "G-1WZ9VRTQ67"
        };

        let db = null;
        let firebaseConnected = false;
        const TEMPO_MEDIO_MUSICA = 5; // minutos

        // --- IDENTIFICAÇÃO DO BAR (multi-tenant) — mesmo esquema do index.html ---
        function obterBarId() {
            const params = new URLSearchParams(window.location.search);
            const bar = (params.get('bar') || '').trim().toLowerCase();
            return bar.replace(/[^a-z0-9-]/g, '');
        }
        const BAR_ID = obterBarId();
        function caminhoBar(sufixo) {
            return `bares/${BAR_ID}/karaoke${sufixo ? '/' + sufixo : ''}`;
        }

        function mostrarErroSemBar() {
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:20px;font-family:sans-serif;color:#FFFFFF;background:#08090D;">
                    <div>
                        <h1 style="font-size:22px;margin-bottom:10px;">⚠️ Link incompleto</h1>
                        <p>Essa página precisa saber qual bar exibir.<br>Peça o link correto pro responsável (algo como <code>?bar=nomedobar</code> no final do endereço).</p>
                    </div>
                </div>`;
        }

        // Gera fagulhas/notas musicais subindo do palco, para dar mais vida à tela
        function criarNotasFlutuantes() {
            const container = document.getElementById('notas-flutuantes');
            const icones = ['fa-music', 'fa-microphone', 'fa-headphones-alt'];
            const total = 14;
            for (let i = 0; i < total; i++) {
                const nota = document.createElement('i');
                const icone = icones[Math.floor(Math.random() * icones.length)];
                nota.className = `fas ${icone} nota-flutuante`;
                nota.style.left = `${Math.random() * 100}%`;
                nota.style.fontSize = `${20 + Math.random() * 30}px`;
                nota.style.animationDuration = `${12 + Math.random() * 10}s`;
                nota.style.animationDelay = `${Math.random() * 15}s`;
                container.appendChild(nota);
            }
        }

        // Monta o QR Code apontando para a página de pedidos (index.html) do MESMO bar,
        // usando a mesma pasta/domínio de onde o display.html está sendo servido
        function configurarQrCode() {
            const urlPedidos = new URL('index.html?bar=' + encodeURIComponent(BAR_ID), window.location.href).href;
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(urlPedidos)}`;
        }

        // Inicializar Firebase
        function initFirebase() {
            if (!BAR_ID) {
                mostrarErroSemBar();
                return;
            }

            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                firebaseConnected = true;
                console.log('✅ Firebase inicializado en display.html');
                atualizarDisplay();

                // Sincronizar cada cambio en tiempo real
                const ref = db.ref(caminhoBar());
                ref.on('value', (snapshot) => {
                    console.log('📡 Datos actualizados en tiempo real');
                    atualizarDisplayWithData(snapshot.val());
                });

                // Mesmo esquema do index.html (monitorarConexaoReal): ".info/connected"
                // é o jeito oficial do Firebase de saber se ESTE dispositivo está
                // realmente conectado em tempo real — sem isso, o badge "Conectado ao
                // Firebase" ficava preso mostrando verde pra sempre (era fixo no CSS),
                // mesmo com a internet caída, e a equipe do bar não tinha como saber
                // que o telão parou de atualizar.
                db.ref('.info/connected').on('value', (snapshot) => {
                    firebaseConnected = snapshot.val() === true;
                    atualizarStatusFirebaseDisplay(firebaseConnected);
                });

                // Rede de segurança: além do tempo real, força uma checagem a cada 5s.
                // Isso evita que o telão fique "atrasado" caso a conexão em tempo real
                // engasgue por algum instante (wifi instável, muita gente votando, etc.)
                setInterval(atualizarDisplay, 5000);
            } catch (error) {
                console.error('❌ Error Firebase:', error);
                firebaseConnected = false;
            }
        }

        // Atualiza o badge "Conectado ao Firebase" (texto + cor de fundo) de forma
        // honesta — precisa refletir a conexão de verdade, não ficar fixo em verde.
        function atualizarStatusFirebaseDisplay(connected) {
            const statusText = document.getElementById('status-text');
            const statusEl = document.getElementById('firebase-status');
            if (connected) {
                statusText.innerText = '🔥 Conectado ao Firebase';
                statusEl.style.background = 'rgb(34, 211, 166)';
            } else {
                statusText.innerText = '⚠️ Sem conexão com o Firebase';
                statusEl.style.background = 'rgb(220, 38, 38)';
            }
        }

        function calcularMediaAvaliacoes(avaliacoes) {
            const notas = Object.values(avaliacoes || {}).map(n => Number(n)).filter(n => !isNaN(n));
            if (notas.length === 0) return null;
            const soma = notas.reduce((a,b) => a + b, 0);
            return Number((soma / notas.length).toFixed(2));
        }

        function atualizarDisplay() {
            if (!firebaseConnected || !db) {
                console.warn('⚠️ Firebase no disponible');
                return;
            }

            const ref = db.ref(caminhoBar());
            ref.once('value', (snapshot) => {
                atualizarDisplayWithData(snapshot.val());
            }).catch((error) => {
                console.error('❌ Error al obtener datos:', error);
            });
        }

        function atualizarDisplayWithData(data) {
            // Ocultar todos los estados
            document.getElementById('estado-inicial').classList.add('hidden');
            document.getElementById('fila-vazia').classList.add('hidden');
            document.getElementById('proximo-cantor').classList.add('hidden');
            document.getElementById('mini-fila-lista').classList.add('hidden');

            // Actualizar status firebase badge
            atualizarStatusFirebaseDisplay(firebaseConnected);

            if (!data) {
                document.getElementById('estado-inicial').classList.remove('hidden');
                document.getElementById('tempo-display').innerText = '0 min';
                return;
            }

            // Se houver uma apresentação em andamento, priorizamos ela
            if (data.apresentacaoAtual) {
                const ap = data.apresentacaoAtual;
                const media = calcularMediaAvaliacoes(ap.avaliacoes);
                const votos = Object.keys(ap.avaliacoes || {}).length;

                document.getElementById('titulo-apresentacao').innerText = 'Apresentação em Andamento';
                document.getElementById('cantor-nombre').innerText = ap.nome || '-';
                document.getElementById('musica-titulo').innerText = ap.musica || '-';
                document.getElementById('musica-artista').innerText = ap.artista || '-';

                const avalArea = document.getElementById('avaliacao-info');
                if (media !== null) {
                    avalArea.innerHTML = `<div style="font-size:22px;color:#FFFFFF;font-weight:700;">Avaliação média: ★ ${media} <span style="font-size:14px;color:#A9AFC0;margin-left:8px;">(${votos} ${votos === 1 ? 'voto' : 'votos'})</span></div>`;
                } else {
                    avalArea.innerHTML = `<div style="font-size:19px;color:#A9AFC0;">Sem avaliações ainda — incentive o público a votar!</div>`;
                }

                // vezes cantadas: se disponível no nó (poder vir com o objeto), senão '-'
                document.getElementById('veces-cantadas').innerText = '-';

                // info de fila
                const fila = data.fila || [];
                document.getElementById('proximos-na-fila').innerText = Math.max(0, fila.length);
                const tempoEstimado = Math.max(0, fila.length) * TEMPO_MEDIO_MUSICA;
                document.getElementById('tempo-espera-display').innerText = tempoEstimado;
                document.getElementById('tempo-display').innerText = tempoEstimado + ' min';
                document.getElementById('ja-cantadas-hoje').innerText = (data.historico || []).length;

                popularMiniFila(fila, 0);

                document.getElementById('proximo-cantor').classList.remove('hidden');
                return;
            }

            // Sem apresentacaoAtual: usamos a fila para mostrar o próximo
            const fila = data.fila || [];
            if (!fila || fila.length === 0) {
                if (data.manualFechada) {
                    document.getElementById('fila-vazia').classList.remove('hidden');
                } else {
                    document.getElementById('estado-inicial').classList.remove('hidden');
                }
                document.getElementById('tempo-display').innerText = '0 min';
                return;
            }

            const proximo = fila[0];
            document.getElementById('titulo-apresentacao').innerText = 'Próximo a Cantar';
            document.getElementById('cantor-nombre').innerText = proximo.nome || '-';
            document.getElementById('musica-titulo').innerText = proximo.musica || '-';
            document.getElementById('musica-artista').innerText = proximo.artista || '-';
            document.getElementById('veces-cantadas').innerText = (typeof proximo.vezesCantadas !== 'undefined') ? `${proximo.vezesCantadas + 1}ª vez` : '-';
            document.getElementById('avaliacao-info').innerHTML = '';

            document.getElementById('proximos-na-fila').innerText = Math.max(0, fila.length - 1);
            const tempoEstimado = Math.max(0, fila.length - 1) * TEMPO_MEDIO_MUSICA;
            document.getElementById('tempo-espera-display').innerText = tempoEstimado;
            document.getElementById('tempo-display').innerText = tempoEstimado + ' min';
            document.getElementById('ja-cantadas-hoje').innerText = (data.historico || []).length;

            popularMiniFila(fila, 1);

            document.getElementById('proximo-cantor').classList.remove('hidden');
        }

        // Preenche a lista "A Seguir" com os próximos da fila (a partir do índice 'partirDe'),
        // mostrando até 4 nomes
        function popularMiniFila(fila, partirDe) {
            const container = document.getElementById('mini-fila-itens');
            const wrapper = document.getElementById('mini-fila-lista');
            const proximos = fila.slice(partirDe, partirDe + 4);

            if (proximos.length === 0) {
                wrapper.classList.add('hidden');
                return;
            }

            wrapper.classList.remove('hidden');
            container.innerHTML = proximos.map((p, i) => `
                <div class="mini-fila-item">
                    <div style="display:flex;align-items:center;">
                        <span class="mini-fila-posicao">${i + 1}</span>
                        <div>
                            <div class="mini-fila-nome">${p.nome}</div>
                            <div class="mini-fila-musica">${p.musica} — ${p.artista}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function resetarDisplay() {
            if (confirm('Deseja resetar o display?')) {
                atualizarDisplay();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Erro ao entrar em tela cheia: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Inicialización
        window.addEventListener('load', () => {
            console.log('📺 Display.html carregado');
            criarNotasFlutuantes();
            configurarQrCode();
            initFirebase();
        });
    </script>
    <script src="pwa.js" defer></script>
</body>
</html>
