<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Exibição - Karaokê Do Città</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8E%A4%3C%2Ftext%3E%3C%2Fsvg%3E">
    <!-- PWA: manifest, cores de instalação e tags específicas de iOS (iOS não lê manifest.json integralmente) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#150a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cantokê">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Oswald:wght@300;400;500;600;700&display=swap');

        :root {
            --cor-fundo-1: #150a0f;
            --cor-fundo-2: #34101d;
            --cor-painel: #241019;
            --cor-painel-clara: #2d1420;
            --cor-ouro: #e8b04b;
            --cor-ouro-claro: #f5cd7e;
            --cor-neon: #ff5d8f;
            --cor-marfim: #f7ecd9;
            --cor-suave: #c9a9a0;
        }

        * { font-family: 'Oswald', sans-serif; }

        /* Rede de segurança: se o CDN do Tailwind demorar/falhar num wifi
           ruim do bar, os estados (aguardando / próximo / fila encerrada)
           não podem aparecer todos sobrepostos na tela. */
        .hidden { display: none !important; }

        body {
            background:
                radial-gradient(ellipse 900px 620px at 50% -8%, rgba(232, 176, 75, 0.18), transparent 60%),
                radial-gradient(ellipse 800px 560px at 92% 105%, rgba(255, 93, 143, 0.16), transparent 60%),
                linear-gradient(180deg, var(--cor-fundo-1) 0%, var(--cor-fundo-2) 100%);
            color: var(--cor-marfim);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Moldura de lâmpadas correndo, como a marquise de um teatro/clube antigo */
        .marquise {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 12px;
            z-index: 5;
            pointer-events: none;
        }
        .marquise::before, .marquise::after {
            content: '';
            position: absolute;
            left: -28px; right: -28px;
            height: 6px;
        }
        .marquise::before {
            top: 0;
            background: radial-gradient(circle, var(--cor-ouro) 0 3px, transparent 4px) 0 0 / 28px 6px repeat-x;
            filter: drop-shadow(0 0 4px rgba(232, 176, 75, 0.8));
            animation: correrLampadas 1.6s linear infinite;
        }
        .marquise::after {
            top: 6px;
            background: radial-gradient(circle, var(--cor-neon) 0 2.5px, transparent 3.5px) 14px 0 / 28px 6px repeat-x;
            filter: drop-shadow(0 0 4px rgba(255, 93, 143, 0.7));
            opacity: 0.85;
            animation: correrLampadas 1.6s linear infinite reverse;
        }
        @keyframes correrLampadas {
            from { background-position-x: 0; }
            to { background-position-x: 28px; }
        }

        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-y: auto;
        }

        /* Cartaz principal: cara de "passe de bastidor", não de card de app */
        .display-card {
            background: var(--cor-painel);
            border-radius: 22px;
            padding: 30px 44px;
            box-shadow: 0 0 0 1px rgba(232, 176, 75, 0.35), 0 0 0 7px rgba(232, 176, 75, 0.08), 0 30px 60px rgba(0, 0, 0, 0.55);
            text-align: center;
            max-width: 900px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .display-logo {
            width: 140px;
            height: auto;
            margin-bottom: 18px;
        }

        .titulo-proximo {
            font-size: 19px;
            color: var(--cor-ouro);
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .mensagem-secundaria {
            font-size: 26px;
            color: var(--cor-suave);
            font-style: italic;
            font-weight: 300;
            margin-top: 6px;
        }

        .cantor-nombre {
            font-family: 'Bodoni Moda', serif;
            font-size: 76px;
            font-weight: 800;
            font-style: italic;
            line-height: 1.08;
            background: linear-gradient(100deg, var(--cor-ouro-claro) 0%, var(--cor-neon) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 34px rgba(232, 176, 75, 0.35);
            margin-bottom: 6px;
            animation: scaleIn 0.6s ease-out;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        /* "Canhoto de ingresso": painel de dados com friso pontilhado (perfuração) */
        .musica-info {
            position: relative;
            background: var(--cor-painel-clara);
            border: 1px dashed rgba(232, 176, 75, 0.4);
            padding: 20px 18px 16px;
            border-radius: 14px;
            margin: 18px 0 0;
        }
        .musica-info::before, .musica-info::after {
            content: '';
            position: absolute;
            top: -9px;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--cor-painel);
            box-shadow: 0 0 0 1px rgba(232, 176, 75, 0.35) inset;
        }
        .musica-info::before { left: -9px; }
        .musica-info::after { right: -9px; }

        .musica-titulo {
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--cor-marfim);
            margin-bottom: 4px;
        }

        .musica-artista {
            font-size: 22px;
            color: var(--cor-suave);
            font-weight: 300;
            font-style: italic;
            margin-bottom: 10px;
        }

        .veces-cantadas {
            display: inline-block;
            background: transparent;
            border: 1px solid var(--cor-ouro);
            color: var(--cor-ouro-claro);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .fila-info {
            margin-top: 16px;
            display: flex;
            justify-content: space-around;
            gap: 12px;
        }

        .fila-stat {
            background: var(--cor-painel-clara);
            border: 1px dashed rgba(232, 176, 75, 0.28);
            padding: 12px 10px;
            border-radius: 12px;
            flex: 1;
        }

        .stat-numero {
            font-family: 'Bodoni Moda', serif;
            font-size: 36px;
            font-weight: 700;
            color: var(--cor-ouro-claro);
        }

        .stat-label {
            font-size: 13px;
            color: var(--cor-suave);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 3px;
        }

        .control-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(21, 10, 15, 0.88);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(232, 176, 75, 0.3);
            padding: 13px 26px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            gap: 12px;
            z-index: 50;
        }

        .control-btn {
            background: transparent;
            border: 1px solid rgba(232, 176, 75, 0.5);
            color: var(--cor-ouro-claro);
            padding: 9px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.25s, color 0.25s;
        }

        .control-btn:hover {
            background: var(--cor-ouro);
            color: #241019;
        }

        .control-btn:focus-visible,
        .fullscreen-btn:focus-visible {
            outline: 2px solid var(--cor-neon);
            outline-offset: 2px;
        }

        .pulse {
            animation: pulse 2.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(232, 176, 75, 0.45), 0 0 0 1px rgba(232, 176, 75, 0.35); }
            50% { box-shadow: 0 0 0 16px rgba(232, 176, 75, 0), 0 0 0 1px rgba(232, 176, 75, 0.35); }
        }

        @media (max-width: 1024px) {
            .display-card { padding: 26px 30px; }
            .cantor-nombre { font-size: 54px; }
            .titulo-proximo { font-size: 17px; }
            .musica-titulo { font-size: 28px; }
            .musica-artista { font-size: 20px; }
        }

        @media (max-width: 768px) {
            .display-card { padding: 20px 20px; }
            .display-logo { width: 90px; }
            .cantor-nombre { font-size: 42px; }
            .titulo-proximo { font-size: 16px; letter-spacing: 3px; }
            .musica-titulo { font-size: 26px; }
            .musica-artista { font-size: 19px; }
            .fila-info { flex-direction: column; gap: 8px; }
            .veces-cantadas { font-size: 14px; }
            .mensagem-secundaria { font-size: 20px; }
        }

        /* Quando a janela do navegador é baixa (não maximizada, sem estar em modo
           tela cheia de verdade), encolhe tudo mais um passo pra evitar a rolagem
           interna no card — o botão de "Tela cheia" resolve isso de vez quando clicado */
        @media (max-height: 850px) {
            .display-card { padding: 14px 24px; max-height: 74vh; }
            .titulo-proximo { font-size: 14px; margin-bottom: 6px; }
            .cantor-nombre { font-size: 34px; margin-bottom: 3px; }
            .musica-info { padding: 10px 12px 8px; margin: 8px 0 0; }
            .musica-titulo { font-size: 22px; margin-bottom: 3px; }
            .musica-artista { font-size: 16px; margin-bottom: 6px; }
            .veces-cantadas { padding: 4px 12px; font-size: 13px; }
            .fila-info { margin-top: 8px; }
            .fila-stat { padding: 6px 8px; }
            .stat-numero { font-size: 22px; }
            .stat-label { font-size: 10px; }
            .mini-fila-lista { margin-top: 8px; }
            .mini-fila-item { padding: 4px 12px; margin-bottom: 3px; }
            .display-logo { width: 70px; margin-bottom: 6px; }
            .qr-card { padding: 6px 12px; margin-top: 8px; max-width: 260px; }
            .qr-card img { width: 40px; height: 40px; }
            .qr-card .qr-titulo { font-size: 12px; }
            .qr-card .qr-sub { font-size: 10px; }
            .mensagem-secundaria { font-size: 17px; }
        }

        .fullscreen-btn {
            position: fixed;
            top: 22px;
            right: 22px;
            background: rgba(21, 10, 15, 0.75);
            border: 1px solid rgba(232, 176, 75, 0.45);
            color: var(--cor-ouro-claro);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
            z-index: 110;
            transition: transform 0.3s, background 0.3s;
        }

        .fullscreen-btn:hover {
            transform: scale(1.08);
            background: rgba(232, 176, 75, 0.2);
        }

        .timer {
            position: fixed;
            top: 22px;
            left: 22px;
            background: rgba(21, 10, 15, 0.75);
            border: 1px solid rgba(232, 176, 75, 0.45);
            padding: 9px 18px;
            border-radius: 50px;
            font-size: 19px;
            font-weight: 600;
            color: var(--cor-ouro-claro);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
        }

        .firebase-status {
            position: fixed;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            padding: 9px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            z-index: 100;
            color: var(--cor-marfim);
            background: rgb(16, 185, 129);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
        }

        /* Fagulhas/notas subindo do palco no fundo */
        .notas-flutuantes {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .nota-flutuante {
            position: absolute;
            bottom: -60px;
            color: var(--cor-ouro);
            opacity: 0.16;
            animation: subirNota linear infinite;
        }
        .nota-flutuante:nth-child(3n) { color: var(--cor-neon); }

        @keyframes subirNota {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.16; }
            90% { opacity: 0.16; }
            100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
        }

        .qr-card, .control-bar, .timer, .firebase-status {
            /* Importante: NÃO definir "position" aqui — cada um já tem seu próprio
               position: fixed declarado antes. Sobrescrever pra "relative" aqui foi
               o bug que tirava tudo do lugar (timer, QR e botão de tela cheia).
               O .fullscreen-btn foi removido dessa lista porque precisa de um
               z-index mais alto (110) pra nunca ficar escondido atrás de nada. */
            z-index: 10;
        }

        /* Card do QR Code para pedidos — segue o mesmo idioma visual de "passe" —
           fica abaixo do card principal, no fluxo normal da página */
        .qr-card {
            background: rgba(36, 16, 25, 0.9);
            border: 1px dashed rgba(232, 176, 75, 0.4);
            border-radius: 14px;
            padding: 10px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            gap: 14px;
            max-width: 320px;
            width: 100%;
            margin: 16px auto 0;
            flex-shrink: 0;
        }

        .qr-card img { width: 52px; height: 52px; border-radius: 8px; flex-shrink: 0; background: #fff; padding: 3px; }

        .qr-card .qr-texto { text-align: left; max-width: 190px; }
        .qr-card .qr-titulo { font-size: 16px; font-weight: 700; color: var(--cor-marfim); line-height: 1.2; text-transform: uppercase; letter-spacing: 0.5px; }
        .qr-card .qr-sub { font-size: 13px; color: var(--cor-ouro-claro); font-weight: 500; margin-top: 4px; }

        /* Lista de próximos na fila, dentro do card principal */
        .mini-fila-lista { margin-top: 18px; text-align: left; }
        .mini-fila-titulo { font-size: 15px; font-weight: 600; color: var(--cor-suave); text-transform: uppercase; letter-spacing: 2.5px; margin-bottom: 8px; text-align: center; }
        .mini-fila-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--cor-painel-clara); border-radius: 10px; padding: 8px 16px; margin-bottom: 6px;
            border-left: 2px solid var(--cor-ouro);
        }
        .mini-fila-item .mini-fila-nome { font-weight: 600; color: var(--cor-marfim); font-size: 20px; }
        .mini-fila-item .mini-fila-musica { color: var(--cor-suave); font-size: 16px; }
        .mini-fila-posicao { background: var(--cor-ouro); color: #241019; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin-right: 10px; }

        @media (max-width: 768px) {
            .qr-card { flex-direction: column; text-align: center; padding: 14px 18px; }
            .qr-card .qr-texto { text-align: center; max-width: none; }
            .qr-card img { width: 70px; height: 70px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .marquise::before, .marquise::after,
            .nota-flutuante,
            .pulse,
            .display-card,
            .cantor-nombre {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Moldura de lâmpadas correndo -->
    <div class="marquise"></div>

    <!-- Fagulhas/notas musicais decorativas -->
    <div class="notas-flutuantes" id="notas-flutuantes"></div>

    <!-- Status Firebase -->
    <div class="firebase-status" id="firebase-status">
        <i class="fas fa-circle mr-2" style="animation: pulse 1s infinite;"></i>
        <span id="status-text">🔥 Conectado ao Firebase</span>
    </div>

    <!-- Timer -->
    <div class="timer">
        <i class="fas fa-hourglass-half mr-2"></i><span id="tempo-display">0 min</span>
    </div>

    <!-- Botão Tela Cheia -->
    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Tela cheia">
        <i class="fas fa-expand"></i>
    </button>

    <!-- Contenedor Principal -->
    <div class="main-container">
        <div class="display-card pulse" id="display-card">

            <!-- Estado Inicial -->
            <div id="estado-inicial" class="hidden">
                <h1 class="titulo-proximo">Karaokê Do Città</h1>
                <p class="mensagem-secundaria">Aguardando próxima música...</p>
            </div>

            <!-- Fila Vazia -->
            <div id="fila-vazia" class="hidden">
                <h1 class="titulo-proximo">Fila Encerrada</h1>
                <p class="mensagem-secundaria">Obrigado por participar!</p>
            </div>

            <!-- Apresentação em Andamento ou Próximo Cantor -->
            <div id="proximo-cantor" class="hidden">

                <h1 class="titulo-proximo" id="titulo-apresentacao">Próximo a Cantar</h1>

                <div class="cantor-nombre" id="cantor-nombre">-</div>

                <div class="musica-info">
                    <div class="musica-titulo" id="musica-titulo">-</div>
                    <div class="musica-artista" id="musica-artista">-</div>
                    <div style="margin-top:12px;" id="avaliacao-info"></div>
                    <div class="veces-cantadas" id="veces-cantadas">0x</div>
                </div>

                <div class="fila-info">
                    <div class="fila-stat">
                        <div class="stat-numero" id="proximos-na-fila">0</div>
                        <div class="stat-label">Próximos na Fila</div>
                    </div>
                    <div class="fila-stat">
                        <div class="stat-numero" id="tempo-espera-display">0</div>
                        <div class="stat-label">min de Espera</div>
                    </div>
                    <div class="fila-stat">
                        <div class="stat-numero" id="ja-cantadas-hoje">0</div>
                        <div class="stat-label">Já Cantaram Hoje</div>
                    </div>
                </div>

                <div class="mini-fila-lista" id="mini-fila-lista">
                    <div class="mini-fila-titulo">A Seguir</div>
                    <div id="mini-fila-itens"></div>
                </div>
            </div>

        </div>

        <!-- Card com QR Code para pedir música — abaixo do card principal,
             nunca sobrepondo o conteúdo -->
        <div class="qr-card">
            <img id="qr-code-img" src="" alt="QR Code para pedir música" />
            <div class="qr-texto">
                <div class="qr-titulo">Quer cantar?</div>
                <div class="qr-sub"><i class="fas fa-qrcode mr-1"></i>Escaneie e peça sua música!</div>
            </div>
        </div>
    </div>

    <!-- Barra de Control -->
    <div class="control-bar">
        <button class="control-btn" onclick="atualizarDisplay()">
            <i class="fas fa-sync mr-2"></i>Atualizar
        </button>
        <button class="control-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-arrow-left mr-2"></i>Voltar
        </button>
        <button class="control-btn" onclick="resetarDisplay()">
            <i class="fas fa-redo mr-2"></i>Resetar
        </button>
    </div>

    <script>
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyB-jzmAdf2eFqpEQVKkFdf7wkURvbzTZBY",
            authDomain: "karaoke-bar-v2.firebaseapp.com",
            databaseURL: "https://karaoke-bar-v2-default-rtdb.firebaseio.com",
            projectId: "karaoke-bar-v2",
            storageBucket: "karaoke-bar-v2.firebasestorage.app",
            messagingSenderId: "851258881456",
            appId: "1:851258881456:web:fb899c2fad3e142b755275",
            measurementId: "G-1WZ9VRTQ67"
        };

        let db = null;
        let firebaseConnected = false;
        const TEMPO_MEDIO_MUSICA = 5; // minutos

        // --- IDENTIFICAÇÃO DO BAR (multi-tenant) — mesmo esquema do index.html ---
        function obterBarId() {
            const params = new URLSearchParams(window.location.search);
            const bar = (params.get('bar') || '').trim().toLowerCase();
            return bar.replace(/[^a-z0-9-]/g, '');
        }
        const BAR_ID = obterBarId();
        function caminhoBar(sufixo) {
            return `bares/${BAR_ID}/karaoke${sufixo ? '/' + sufixo : ''}`;
        }

        function mostrarErroSemBar() {
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:20px;font-family:sans-serif;color:#f7ecd9;background:#150a0f;">
                    <div>
                        <h1 style="font-size:22px;margin-bottom:10px;">⚠️ Link incompleto</h1>
                        <p>Essa página precisa saber qual bar exibir.<br>Peça o link correto pro responsável (algo como <code>?bar=nomedobar</code> no final do endereço).</p>
                    </div>
                </div>`;
        }

        // Gera fagulhas/notas musicais subindo do palco, para dar mais vida à tela
        function criarNotasFlutuantes() {
            const container = document.getElementById('notas-flutuantes');
            const icones = ['fa-music', 'fa-microphone', 'fa-headphones-alt'];
            const total = 14;
            for (let i = 0; i < total; i++) {
                const nota = document.createElement('i');
                const icone = icones[Math.floor(Math.random() * icones.length)];
                nota.className = `fas ${icone} nota-flutuante`;
                nota.style.left = `${Math.random() * 100}%`;
                nota.style.fontSize = `${20 + Math.random() * 30}px`;
                nota.style.animationDuration = `${12 + Math.random() * 10}s`;
                nota.style.animationDelay = `${Math.random() * 15}s`;
                container.appendChild(nota);
            }
        }

        // Monta o QR Code apontando para a página de pedidos (index.html) do MESMO bar,
        // usando a mesma pasta/domínio de onde o display.html está sendo servido
        function configurarQrCode() {
            const urlPedidos = new URL('index.html?bar=' + encodeURIComponent(BAR_ID), window.location.href).href;
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(urlPedidos)}`;
        }

        // Inicializar Firebase
        function initFirebase() {
            if (!BAR_ID) {
                mostrarErroSemBar();
                return;
            }

            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                firebaseConnected = true;
                console.log('✅ Firebase inicializado en display.html');
                atualizarDisplay();

                // Sincronizar cada cambio en tiempo real
                const ref = db.ref(caminhoBar());
                ref.on('value', (snapshot) => {
                    console.log('📡 Datos actualizados en tiempo real');
                    atualizarDisplayWithData(snapshot.val());
                });

                // Mesmo esquema do index.html (monitorarConexaoReal): ".info/connected"
                // é o jeito oficial do Firebase de saber se ESTE dispositivo está
                // realmente conectado em tempo real — sem isso, o badge "Conectado ao
                // Firebase" ficava preso mostrando verde pra sempre (era fixo no CSS),
                // mesmo com a internet caída, e a equipe do bar não tinha como saber
                // que o telão parou de atualizar.
                db.ref('.info/connected').on('value', (snapshot) => {
                    firebaseConnected = snapshot.val() === true;
                    atualizarStatusFirebaseDisplay(firebaseConnected);
                });

                // Rede de segurança: além do tempo real, força uma checagem a cada 5s.
                // Isso evita que o telão fique "atrasado" caso a conexão em tempo real
                // engasgue por algum instante (wifi instável, muita gente votando, etc.)
                setInterval(atualizarDisplay, 5000);
            } catch (error) {
                console.error('❌ Error Firebase:', error);
                firebaseConnected = false;
            }
        }

        // Atualiza o badge "Conectado ao Firebase" (texto + cor de fundo) de forma
        // honesta — precisa refletir a conexão de verdade, não ficar fixo em verde.
        function atualizarStatusFirebaseDisplay(connected) {
            const statusText = document.getElementById('status-text');
            const statusEl = document.getElementById('firebase-status');
            if (connected) {
                statusText.innerText = '🔥 Conectado ao Firebase';
                statusEl.style.background = 'rgb(16, 185, 129)';
            } else {
                statusText.innerText = '⚠️ Sem conexão com o Firebase';
                statusEl.style.background = 'rgb(220, 38, 38)';
            }
        }

        function calcularMediaAvaliacoes(avaliacoes) {
            const notas = Object.values(avaliacoes || {}).map(n => Number(n)).filter(n => !isNaN(n));
            if (notas.length === 0) return null;
            const soma = notas.reduce((a,b) => a + b, 0);
            return Number((soma / notas.length).toFixed(2));
        }

        function atualizarDisplay() {
            if (!firebaseConnected || !db) {
                console.warn('⚠️ Firebase no disponible');
                return;
            }

            const ref = db.ref(caminhoBar());
            ref.once('value', (snapshot) => {
                atualizarDisplayWithData(snapshot.val());
            }).catch((error) => {
                console.error('❌ Error al obtener datos:', error);
            });
        }

        function atualizarDisplayWithData(data) {
            // Ocultar todos los estados
            document.getElementById('estado-inicial').classList.add('hidden');
            document.getElementById('fila-vazia').classList.add('hidden');
            document.getElementById('proximo-cantor').classList.add('hidden');
            document.getElementById('mini-fila-lista').classList.add('hidden');

            // Actualizar status firebase badge
            atualizarStatusFirebaseDisplay(firebaseConnected);

            if (!data) {
                document.getElementById('estado-inicial').classList.remove('hidden');
                document.getElementById('tempo-display').innerText = '0 min';
                return;
            }

            // Se houver uma apresentação em andamento, priorizamos ela
            if (data.apresentacaoAtual) {
                const ap = data.apresentacaoAtual;
                const media = calcularMediaAvaliacoes(ap.avaliacoes);
                const votos = Object.keys(ap.avaliacoes || {}).length;

                document.getElementById('titulo-apresentacao').innerText = 'Apresentação em Andamento';
                document.getElementById('cantor-nombre').innerText = ap.nome || '-';
                document.getElementById('musica-titulo').innerText = ap.musica || '-';
                document.getElementById('musica-artista').innerText = ap.artista || '-';

                const avalArea = document.getElementById('avaliacao-info');
                if (media !== null) {
                    avalArea.innerHTML = `<div style="font-size:22px;color:#f7ecd9;font-weight:700;">Avaliação média: ★ ${media} <span style="font-size:14px;color:#c9a9a0;margin-left:8px;">(${votos} ${votos === 1 ? 'voto' : 'votos'})</span></div>`;
                } else {
                    avalArea.innerHTML = `<div style="font-size:19px;color:#c9a9a0;">Sem avaliações ainda — incentive o público a votar!</div>`;
                }

                // vezes cantadas: se disponível no nó (poder vir com o objeto), senão '-'
                document.getElementById('veces-cantadas').innerText = '-';

                // info de fila
                const fila = data.fila || [];
                document.getElementById('proximos-na-fila').innerText = Math.max(0, fila.length);
                const tempoEstimado = Math.max(0, fila.length) * TEMPO_MEDIO_MUSICA;
                document.getElementById('tempo-espera-display').innerText = tempoEstimado;
                document.getElementById('tempo-display').innerText = tempoEstimado + ' min';
                document.getElementById('ja-cantadas-hoje').innerText = (data.historico || []).length;

                popularMiniFila(fila, 0);

                document.getElementById('proximo-cantor').classList.remove('hidden');
                return;
            }

            // Sem apresentacaoAtual: usamos a fila para mostrar o próximo
            const fila = data.fila || [];
            if (!fila || fila.length === 0) {
                if (data.manualFechada) {
                    document.getElementById('fila-vazia').classList.remove('hidden');
                } else {
                    document.getElementById('estado-inicial').classList.remove('hidden');
                }
                document.getElementById('tempo-display').innerText = '0 min';
                return;
            }

            const proximo = fila[0];
            document.getElementById('titulo-apresentacao').innerText = 'Próximo a Cantar';
            document.getElementById('cantor-nombre').innerText = proximo.nome || '-';
            document.getElementById('musica-titulo').innerText = proximo.musica || '-';
            document.getElementById('musica-artista').innerText = proximo.artista || '-';
            document.getElementById('veces-cantadas').innerText = (typeof proximo.vezesCantadas !== 'undefined') ? `${proximo.vezesCantadas + 1}ª vez` : '-';
            document.getElementById('avaliacao-info').innerHTML = '';

            document.getElementById('proximos-na-fila').innerText = Math.max(0, fila.length - 1);
            const tempoEstimado = Math.max(0, fila.length - 1) * TEMPO_MEDIO_MUSICA;
            document.getElementById('tempo-espera-display').innerText = tempoEstimado;
            document.getElementById('tempo-display').innerText = tempoEstimado + ' min';
            document.getElementById('ja-cantadas-hoje').innerText = (data.historico || []).length;

            popularMiniFila(fila, 1);

            document.getElementById('proximo-cantor').classList.remove('hidden');
        }

        // Preenche a lista "A Seguir" com os próximos da fila (a partir do índice 'partirDe'),
        // mostrando até 4 nomes
        function popularMiniFila(fila, partirDe) {
            const container = document.getElementById('mini-fila-itens');
            const wrapper = document.getElementById('mini-fila-lista');
            const proximos = fila.slice(partirDe, partirDe + 4);

            if (proximos.length === 0) {
                wrapper.classList.add('hidden');
                return;
            }

            wrapper.classList.remove('hidden');
            container.innerHTML = proximos.map((p, i) => `
                <div class="mini-fila-item">
                    <div style="display:flex;align-items:center;">
                        <span class="mini-fila-posicao">${i + 1}</span>
                        <div>
                            <div class="mini-fila-nome">${p.nome}</div>
                            <div class="mini-fila-musica">${p.musica} — ${p.artista}</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function resetarDisplay() {
            if (confirm('Deseja resetar o display?')) {
                atualizarDisplay();
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Erro ao entrar em tela cheia: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // Inicialización
        window.addEventListener('load', () => {
            console.log('📺 Display.html carregado');
            criarNotasFlutuantes();
            configurarQrCode();
            initFirebase();
        });
    </script>
    <script src="pwa.js" defer></script>
</body>
</html>
